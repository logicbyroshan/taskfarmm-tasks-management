<article class="task-card task-card-modern {% if task.status == 'completed' %}is-completed{% endif %}" 
         id="task-card-{{ task.id }}" 
         data-task-id="{{ task.id }}"
         x-data="{ dropdownOpen: false }">
    <div class="task-card-top" style="display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;">
        <div style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;">
            <!-- 1-Click HTMX Status Checkbox Toggle -->
            <button type="button" 
                    class="task-check-circle {% if task.status == 'completed' %}checked{% endif %}" 
                    hx-post="{% url 'task_toggle_status' task.id %}" 
                    hx-target="closest .task-card-modern" 
                    hx-swap="outerHTML" 
                    title="Toggle Task Completion" 
                    aria-label="Toggle task status"
                    style="background: transparent; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center;">
                {% if task.status == 'completed' %}
                <i class="fas fa-check-circle" style="color: #10b981; font-size: 1.25rem;"></i>
                {% else %}
                <i class="far fa-circle" style="color: #71717a; font-size: 1.25rem;"></i>
                {% endif %}
            </button>

            <!-- Status Pill Badge -->
            <span class="status-pill status-{{ task.status }}">
                {{ task.get_status_display|upper }}
            </span>
        </div>

        <!-- 3-Dot Options Dropdown (Alpine.js) -->
        <div class="task-menu-container" style="position: relative;" @click.outside="dropdownOpen = false">
            <button class="task-menu-btn" 
                    type="button" 
                    @click.stop="dropdownOpen = !dropdownOpen" 
                    aria-label="Task options">
                <i class="fas fa-ellipsis-v"></i>
            </button>
            <div class="task-dropdown-menu" 
                 x-show="dropdownOpen" 
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="opacity-0 scale-95"
                 x-transition:enter-end="opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="opacity-100 scale-100"
                 x-transition:leave-end="opacity-0 scale-95"
                 style="display: none; position: absolute; right: 0; top: calc(100% + 4px); background: #000000; border: 1px solid #27272a; border-radius: 8px; padding: 4px; z-index: 99999; min-width: 140px; box-shadow: 0 10px 30px rgba(0,0,0,0.9);">
                <button type="button" 
                        class="dropdown-item" 
                        @click="dropdownOpen = false; window.openEditTaskModal({{ task.id }})" 
                        style="width: 100%; border: none; background: transparent; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 0.825rem; color: #e4e4e7; border-radius: 6px; text-align: left; cursor: pointer;">
                    <i class="fas fa-edit" style="color: #60a5fa;"></i> Edit
                </button>
                <button type="button" 
                        class="dropdown-item" 
                        hx-post="{% url 'task_delete' task.id %}" 
                        hx-confirm="Are you sure you want to delete '{{ task.title|escapejs }}'?" 
                        hx-target="closest .task-card-modern" 
                        hx-swap="outerHTML swap:0.3s"
                        @click="dropdownOpen = false"
                        style="width: 100%; border: none; background: transparent; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-size: 0.825rem; color: #f87171; border-radius: 6px; text-align: left; cursor: pointer;">
                    <i class="fas fa-trash" style="color: #f87171;"></i> Delete
                </button>
            </div>
        </div>
    </div>

    <!-- Task Body (Title & Description) -->
    <div class="task-body" style="margin: 12px 0 14px 0;">
        <h3 class="task-title {% if task.status == 'completed' %}strike-through{% endif %}" style="margin: 0 0 6px 0; font-size: 0.95rem; font-weight: 600; color: #ffffff;">
            {{ task.title }}
        </h3>
        {% if task.description %}
        <p class="task-desc {% if task.status == 'completed' %}strike-through{% endif %}" style="margin: 0; font-size: 0.825rem; color: #a1a1aa; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">
            {{ task.description|striptags }}
        </p>
        {% endif %}
    </div>

    <!-- Task Footer Metadata -->
    <div class="task-meta" style="display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding-top: 10px; border-top: 1px solid #18181b;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <!-- Priority Badge -->
            <span class="priority-badge priority-{{ task.priority }}" style="font-size: 0.725rem; font-weight: 600; padding: 3px 8px; border-radius: 4px; display: inline-flex; align-items: center; gap: 4px;">
                <i class="fas fa-circle" style="font-size: 0.45rem;"></i> {{ task.get_priority_display }}
            </span>

            <!-- Project Pill -->
            {% if task.category %}
            <span class="project-pill" style="font-size: 0.725rem; font-weight: 500; padding: 3px 8px; border-radius: 4px; background: {{ task.category.color }}18; color: {{ task.category.color }}; border: 1px solid {{ task.category.color }}35; display: inline-flex; align-items: center; gap: 5px;">
                <i class="fas fa-folder" style="font-size: 0.65rem;"></i> {{ task.category.name }}
            </span>
            {% endif %}
        </div>

        <!-- Due Date -->
        {% if task.due_date %}
        <span class="due-date-pill" style="font-size: 0.725rem; color: #a1a1aa; display: inline-flex; align-items: center; gap: 4px;">
            <i class="far fa-calendar-alt"></i> {{ task.due_date|date:"d M" }}
        </span>
        {% endif %}
    </div>
</article>
