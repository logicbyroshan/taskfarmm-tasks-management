<!-- Add Project Modal -->
<div id="category-modal" class="task-modal" style="display: none;">
    <div class="modal-backdrop" onclick="document.getElementById('category-modal').style.display='none';"></div>
    <div class="modal-content" style="background: #000000; border: 1px solid #27272a; max-width: 520px;">
        <div class="modal-header">
            <h3><i class="fas fa-folder-plus" style="color: var(--accent-color);"></i> Add New Project</h3>
            <button id="category-modal-close-btn" class="close-modal" aria-label="Close" onclick="document.getElementById('category-modal').style.display='none';">&times;</button>
        </div>
        <form id="category-form" method="post" action="{% url 'project_create' %}">
            {% csrf_token %}
            <div class="modal-body" style="display: flex; flex-direction: column; gap: 14px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="new_project_name"><i class="fas fa-tag"></i> Project Name *</label>
                    <input type="text" id="new_project_name" name="name" required class="form-control" placeholder="e.g. Mobile App Redesign" style="background: #000000; border: 1px solid #27272a;">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="new_project_color"><i class="fas fa-palette"></i> Theme Color</label>
                    <input type="color" id="new_project_color" name="color" value="#3b82f6" class="form-control" style="height: 38px; background: #000000; border: 1px solid #27272a; cursor: pointer;">
                </div>
                
                <!-- Board Workflow Template -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #dee4ea; margin-bottom: 6px;">
                        <i class="fas fa-columns" style="color: #579dff;"></i> Kanban Board Workflow Template
                    </label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <label class="board-template-card" style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid #3b82f6; border-radius: 8px; background: rgba(59, 130, 246, 0.08); cursor: pointer; transition: all 0.15s ease;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <span style="font-size: 0.85rem; font-weight: 700; color: #579dff;">⚡ Smart Work</span>
                                <input type="radio" name="board_template" value="smart" checked style="accent-color: #3b82f6;">
                            </div>
                            <span style="font-size: 0.725rem; color: #8c9bab; line-height: 1.3;">4 Lists: To Do, In Progress, On Hold, Done</span>
                            <div style="display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap;">
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #22272b; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">To Do</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #22272b; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">In Prog</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #22272b; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">Hold</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #22272b; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">Done</span>
                            </div>
                        </label>
                        <label class="board-template-card" style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid #27272a; border-radius: 8px; background: #121316; cursor: pointer; transition: all 0.15s ease;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <span style="font-size: 0.85rem; font-weight: 700; color: #e4e4e7;">🚀 Super Work</span>
                                <input type="radio" name="board_template" value="super" style="accent-color: #3b82f6;">
                            </div>
                            <span style="font-size: 0.725rem; color: #8c9bab; line-height: 1.3;">6 Lists: Backlog, To Do, In Progress, On Hold, Done, Canceled</span>
                            <div style="display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap;">
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #22272b; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">Backlog</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #22272b; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">To Do</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #22272b; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">Done</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #22272b; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">Cancel</span>
                            </div>
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-actions form-actions" style="margin-top: 14px;">
                <button type="button" class="btn-cancel" onclick="document.getElementById('category-modal').style.display='none';">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-check"></i> Create Project
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Edit Project Modal -->
<div id="edit-category-modal" class="task-modal" style="display: none;">
    <div class="modal-backdrop" onclick="document.getElementById('edit-category-modal').style.display='none';"></div>
    <div class="modal-content" style="background: #000000; border: 1px solid #27272a; max-width: 520px;">
        <div class="modal-header">
            <h3><i class="fas fa-edit" style="color: #60a5fa;"></i> Edit Project</h3>
            <button class="close-modal" aria-label="Close" onclick="document.getElementById('edit-category-modal').style.display='none';">&times;</button>
        </div>
        <form id="edit-category-form" method="post">
            {% csrf_token %}
            <input type="hidden" id="edit_project_id" name="project_id">
            <div class="modal-body" style="display: flex; flex-direction: column; gap: 14px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="edit_project_name"><i class="fas fa-tag"></i> Project Name *</label>
                    <input type="text" id="edit_project_name" name="name" required class="form-control" style="background: #000000; border: 1px solid #27272a;">
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="edit_project_color"><i class="fas fa-palette"></i> Theme Color</label>
                    <input type="color" id="edit_project_color" name="color" class="form-control" style="height: 38px; background: #000000; border: 1px solid #27272a; cursor: pointer;">
                </div>

                <!-- Board Workflow Template in Edit -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #dee4ea; margin-bottom: 6px;">
                        <i class="fas fa-columns" style="color: #579dff;"></i> Kanban Board Workflow Template
                    </label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                        <label class="board-template-card" id="edit-tpl-smart-card" style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid #27272a; border-radius: 8px; background: #121316; cursor: pointer; transition: all 0.15s ease;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <span style="font-size: 0.85rem; font-weight: 700; color: #579dff;">⚡ Smart Work</span>
                                <input type="radio" id="edit_tpl_smart" name="board_template" value="smart" style="accent-color: #3b82f6;">
                            </div>
                            <span style="font-size: 0.725rem; color: #8c9bab; line-height: 1.3;">4 Lists: To Do, In Progress, On Hold, Done</span>
                        </label>
                        <label class="board-template-card" id="edit-tpl-super-card" style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border: 1px solid #27272a; border-radius: 8px; background: #121316; cursor: pointer; transition: all 0.15s ease;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <span style="font-size: 0.85rem; font-weight: 700; color: #e4e4e7;">🚀 Super Work</span>
                                <input type="radio" id="edit_tpl_super" name="board_template" value="super" style="accent-color: #3b82f6;">
                            </div>
                            <span style="font-size: 0.725rem; color: #8c9bab; line-height: 1.3;">6 Lists: Backlog, To Do, In Progress, On Hold, Done, Canceled</span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-actions form-actions" style="margin-top: 14px;">
                <button type="button" id="edit-project-delete-btn" class="btn-danger" style="margin-right: auto;">
                    <i class="fas fa-trash"></i> Delete Project
                </button>
                <button type="button" class="btn-cancel" onclick="document.getElementById('edit-category-modal').style.display='none';">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-check"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>
