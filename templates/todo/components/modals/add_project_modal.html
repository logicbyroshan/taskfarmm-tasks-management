<!-- Add Project Modal -->
<div id="category-modal" class="task-modal" style="display: none; position: fixed; inset: 0; z-index: 10000; align-items: center; justify-content: center;">
    <div class="modal-backdrop" onclick="closeAddProjectModal()" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);"></div>
    <div class="modal-content" style="position: relative; background: #000000; border: 1px solid #27272a; border-radius: 12px; max-width: 600px; width: 92%; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9); z-index: 10001;">
        <div class="modal-header" style="display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid #1f2328;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 34px; height: 34px; border-radius: 8px; background: rgba(59, 130, 246, 0.15); color: #60a5fa; display: flex; align-items: center; justify-content: center; font-size: 1rem;">
                    <i class="fas fa-folder-plus"></i>
                </div>
                <div>
                    <h3 style="margin: 0; font-size: 1.15rem; font-weight: 700; color: #ffffff;">Create New Project</h3>
                    <p style="margin: 2px 0 0 0; font-size: 0.775rem; color: #8c9bab;">Set up a project board with dedicated Kanban workflow</p>
                </div>
            </div>
            <button type="button" id="category-modal-close-btn" class="close-modal" aria-label="Close" onclick="closeAddProjectModal()" style="background: #16181d; border: 1px solid #27272a; border-radius: 6px; color: #8c9bab; width: 32px; height: 32px; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="category-form" method="post" action="{% url 'project_create' %}">
            {% csrf_token %}
            <div class="modal-body" style="padding: 24px; display: flex; flex-direction: column; gap: 18px;">
                
                <!-- Project Title Input with Auto-Correct -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="new_project_name" style="display: block; font-size: 0.85rem; font-weight: 600; color: #dee4ea; margin-bottom: 6px;">
                        Project Name *
                    </label>
                    <input type="text" 
                           id="new_project_name" 
                           name="name" 
                           required 
                           spellcheck="true"
                           class="form-control" 
                           placeholder="e.g. Website Redesign & Brand Assets" 
                           style="background: #121316; border: 1px solid #27272a; color: #dee4ea; font-size: 0.95rem; padding: 12px 14px; border-radius: 8px; width: 100%; box-sizing: border-box; outline: none; font-family: inherit;"
                           onfocus="this.style.borderColor='#3b82f6';"
                           onblur="this.style.borderColor='#27272a';">
                </div>

                <!-- Color Palette Selection -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #dee4ea; margin-bottom: 8px;">
                        <i class="fas fa-palette" style="color: #60a5fa;"></i> Project Color Accent
                    </label>
                    <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                        <div id="add-color-swatches" style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
                            <button type="button" onclick="selectAddProjectColor('#3b82f6')" class="color-swatch-btn active" style="width: 28px; height: 28px; border-radius: 50%; background: #3b82f6; border: 2px solid #ffffff; cursor: pointer;"></button>
                            <button type="button" onclick="selectAddProjectColor('#10b981')" class="color-swatch-btn" style="width: 28px; height: 28px; border-radius: 50%; background: #10b981; border: 2px solid transparent; cursor: pointer;"></button>
                            <button type="button" onclick="selectAddProjectColor('#8b5cf6')" class="color-swatch-btn" style="width: 28px; height: 28px; border-radius: 50%; background: #8b5cf6; border: 2px solid transparent; cursor: pointer;"></button>
                            <button type="button" onclick="selectAddProjectColor('#06b6d4')" class="color-swatch-btn" style="width: 28px; height: 28px; border-radius: 50%; background: #06b6d4; border: 2px solid transparent; cursor: pointer;"></button>
                            <button type="button" onclick="selectAddProjectColor('#f59e0b')" class="color-swatch-btn" style="width: 28px; height: 28px; border-radius: 50%; background: #f59e0b; border: 2px solid transparent; cursor: pointer;"></button>
                            <button type="button" onclick="selectAddProjectColor('#ec4899')" class="color-swatch-btn" style="width: 28px; height: 28px; border-radius: 50%; background: #ec4899; border: 2px solid transparent; cursor: pointer;"></button>
                            <button type="button" onclick="selectAddProjectColor('#ef4444')" class="color-swatch-btn" style="width: 28px; height: 28px; border-radius: 50%; background: #ef4444; border: 2px solid transparent; cursor: pointer;"></button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 6px; margin-left: auto;">
                            <span style="font-size: 0.775rem; color: #8c9bab;">Custom:</span>
                            <input type="color" id="new_project_color" name="color" value="#3b82f6" onchange="syncAddProjectCustomColor(this.value)" style="width: 32px; height: 32px; padding: 0; background: transparent; border: 1px solid #27272a; border-radius: 6px; cursor: pointer;">
                        </div>
                    </div>
                </div>

                <!-- Board Workflow Template Selection -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="display: block; font-size: 0.85rem; font-weight: 600; color: #dee4ea; margin-bottom: 8px;">
                        <i class="fas fa-columns" style="color: #60a5fa;"></i> Kanban Workflow Template
                    </label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <!-- Smart Work Template Option -->
                        <label id="add-tpl-smart-label" class="board-template-card" onclick="selectAddTemplate('smart')" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1.5px solid #3b82f6; border-radius: 10px; background: rgba(59, 130, 246, 0.08); cursor: pointer; transition: all 0.15s ease;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <span style="font-size: 1rem;">⚡</span>
                                    <span style="font-size: 0.875rem; font-weight: 700; color: #60a5fa;">Smart Work</span>
                                </div>
                                <input type="radio" id="add_tpl_smart" name="board_template" value="smart" checked style="accent-color: #3b82f6; width: 16px; height: 16px;">
                            </div>
                            <span style="font-size: 0.75rem; color: #8c9bab; line-height: 1.3;">4 Focused Lists for agile delivery</span>
                            <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px;">
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #27272a; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">To Do</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #27272a; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">In Progress</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #27272a; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">On Hold</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #27272a; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">Done</span>
                            </div>
                        </label>

                        <!-- Super Work Template Option -->
                        <label id="add-tpl-super-label" class="board-template-card" onclick="selectAddTemplate('super')" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border: 1.5px solid #27272a; border-radius: 10px; background: #121316; cursor: pointer; transition: all 0.15s ease;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 6px;">
                                    <span style="font-size: 1rem;">🚀</span>
                                    <span style="font-size: 0.875rem; font-weight: 700; color: #e4e4e7;">Super Work</span>
                                </div>
                                <input type="radio" id="add_tpl_super" name="board_template" value="super" style="accent-color: #3b82f6; width: 16px; height: 16px;">
                            </div>
                            <span style="font-size: 0.75rem; color: #8c9bab; line-height: 1.3;">6 Full-Lifecycle Columns with Backlog & Canceled</span>
                            <div style="display: flex; gap: 4px; flex-wrap: wrap; margin-top: 2px;">
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #27272a; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">Backlog</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #27272a; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">To Do</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #27272a; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">Done</span>
                                <span style="font-size: 0.65rem; background: #16181d; border: 1px solid #27272a; padding: 2px 6px; border-radius: 4px; color: #dee4ea;">Canceled</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Description / Purpose (Optional) -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="new_project_description" style="display: block; font-size: 0.825rem; font-weight: 600; color: #8c9bab; margin-bottom: 6px;">
                        Description / Key Goals (Optional)
                    </label>
                    <textarea id="new_project_description" 
                              name="description" 
                              rows="2" 
                              spellcheck="true"
                              placeholder="Brief goals or notes for this project..."
                              style="background: #121316; border: 1px solid #27272a; color: #dee4ea; font-size: 0.875rem; padding: 10px 12px; border-radius: 8px; width: 100%; box-sizing: border-box; outline: none; font-family: inherit; resize: vertical; min-height: 56px;"
                              onfocus="this.style.borderColor='#3b82f6';"
                              onblur="this.style.borderColor='#27272a';"></textarea>
                </div>
            </div>

            <!-- Modal Action Buttons -->
            <div class="modal-actions" style="display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #1f2328; background: #090a0c; border-bottom-left-radius: 12px; border-bottom-right-radius: 12px;">
                <button type="button" class="btn-cancel" onclick="closeAddProjectModal()" style="height: 38px; padding: 0 16px; font-size: 0.85rem; font-weight: 600; color: #dee4ea; background: #16181d; border: 1px solid #27272a; border-radius: 6px; cursor: pointer; transition: all 0.15s ease;">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn-submit" style="height: 38px; padding: 0 20px; font-size: 0.875rem; font-weight: 600; color: #ffffff; background: #2563eb; border: none; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s ease;">
                    <i class="fas fa-check"></i> Create Project
                </button>
            </div>
        </form>
    </div>
</div>
