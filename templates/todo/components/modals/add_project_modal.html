<!-- Add Project Modal -->
<div id="category-modal" class="task-modal" style="display: none; position: fixed; inset: 0; z-index: 10000; align-items: center; justify-content: center;">
    <div class="modal-backdrop" onclick="closeAddProjectModal()" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(8px);"></div>
    <div class="modal-content" style="position: relative; background: #09090b; border: 1px solid #27272a; border-radius: 16px; max-width: 760px; width: 94%; max-height: 90vh; overflow-y: auto; box-shadow: 0 30px 70px rgba(0, 0, 0, 0.95); z-index: 10001;">
        <!-- Modal Header -->
        <div class="modal-header" style="display: flex; align-items: center; justify-content: space-between; padding: 24px 28px; border-bottom: 1px solid #1f2328; background: #101114;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 40px; height: 40px; border-radius: 10px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.35); color: #60a5fa; display: flex; align-items: center; justify-content: center; font-size: 1.15rem;">
                    <i class="fas fa-folder-plus"></i>
                </div>
                <div>
                    <h3 style="margin: 0; font-size: 1.25rem; font-weight: 700; color: #ffffff;">Create New Project</h3>
                    <p style="margin: 3px 0 0 0; font-size: 0.825rem; color: #a1a1aa;">Set up a project board with dedicated Kanban workflow and team members</p>
                </div>
            </div>
            <button type="button" id="category-modal-close-btn" class="close-modal" aria-label="Close" onclick="closeAddProjectModal()" style="background: #18181b; border: 1px solid #27272a; border-radius: 8px; color: #a1a1aa; width: 34px; height: 34px; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.15s ease;">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <form id="category-form" method="post" action="{% url 'project_create' %}">
            {% csrf_token %}
            <div class="modal-body" style="padding: 26px 28px; display: flex; flex-direction: column; gap: 20px;">
                
                <!-- Project Title Input with Auto-Correct -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="new_project_name" style="display: block; font-size: 0.88rem; font-weight: 600; color: #ffffff; margin-bottom: 8px;">
                        Project Name <span style="color: #ef4444;">*</span>
                    </label>
                    <input type="text" 
                           id="new_project_name" 
                           name="name" 
                           required 
                           spellcheck="true"
                           class="form-control" 
                           placeholder="e.g. Website Redesign & Brand Assets" 
                           style="background: #121316; border: 1px solid #27272a; color: #ffffff; font-size: 1rem; padding: 13px 16px; border-radius: 9px; width: 100%; box-sizing: border-box; outline: none; font-family: inherit;"
                           onfocus="this.style.borderColor='#3b82f6';"
                           onblur="this.style.borderColor='#27272a';">
                </div>

                <!-- Color Palette Selection (True Squares) -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="display: block; font-size: 0.88rem; font-weight: 600; color: #ffffff; margin-bottom: 10px;">
                        <i class="fas fa-palette" style="color: #60a5fa; margin-right: 4px;"></i> Project Color Accent
                    </label>
                    <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                        <div id="add-color-swatches" style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                            <button type="button" onclick="selectAddProjectColor('#3b82f6')" class="color-swatch-btn active" style="width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; aspect-ratio: 1 / 1 !important; flex: 0 0 36px !important; padding: 0 !important; margin: 0 !important; border-radius: 6px; background: #3b82f6; border: 2px solid #ffffff; cursor: pointer; box-sizing: border-box;"></button>
                            <button type="button" onclick="selectAddProjectColor('#10b981')" class="color-swatch-btn" style="width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; aspect-ratio: 1 / 1 !important; flex: 0 0 36px !important; padding: 0 !important; margin: 0 !important; border-radius: 6px; background: #10b981; border: 2px solid transparent; cursor: pointer; box-sizing: border-box;"></button>
                            <button type="button" onclick="selectAddProjectColor('#8b5cf6')" class="color-swatch-btn" style="width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; aspect-ratio: 1 / 1 !important; flex: 0 0 36px !important; padding: 0 !important; margin: 0 !important; border-radius: 6px; background: #8b5cf6; border: 2px solid transparent; cursor: pointer; box-sizing: border-box;"></button>
                            <button type="button" onclick="selectAddProjectColor('#06b6d4')" class="color-swatch-btn" style="width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; aspect-ratio: 1 / 1 !important; flex: 0 0 36px !important; padding: 0 !important; margin: 0 !important; border-radius: 6px; background: #06b6d4; border: 2px solid transparent; cursor: pointer; box-sizing: border-box;"></button>
                            <button type="button" onclick="selectAddProjectColor('#f59e0b')" class="color-swatch-btn" style="width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; aspect-ratio: 1 / 1 !important; flex: 0 0 36px !important; padding: 0 !important; margin: 0 !important; border-radius: 6px; background: #f59e0b; border: 2px solid transparent; cursor: pointer; box-sizing: border-box;"></button>
                            <button type="button" onclick="selectAddProjectColor('#ec4899')" class="color-swatch-btn" style="width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; aspect-ratio: 1 / 1 !important; flex: 0 0 36px !important; padding: 0 !important; margin: 0 !important; border-radius: 6px; background: #ec4899; border: 2px solid transparent; cursor: pointer; box-sizing: border-box;"></button>
                            <button type="button" onclick="selectAddProjectColor('#ef4444')" class="color-swatch-btn" style="width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; aspect-ratio: 1 / 1 !important; flex: 0 0 36px !important; padding: 0 !important; margin: 0 !important; border-radius: 6px; background: #ef4444; border: 2px solid transparent; cursor: pointer; box-sizing: border-box;"></button>
                            <button type="button" onclick="selectAddProjectColor('#f97316')" class="color-swatch-btn" style="width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; aspect-ratio: 1 / 1 !important; flex: 0 0 36px !important; padding: 0 !important; margin: 0 !important; border-radius: 6px; background: #f97316; border: 2px solid transparent; cursor: pointer; box-sizing: border-box;"></button>
                            <button type="button" onclick="selectAddProjectColor('#0ea5e9')" class="color-swatch-btn" style="width: 36px !important; height: 36px !important; min-width: 36px !important; max-width: 36px !important; aspect-ratio: 1 / 1 !important; flex: 0 0 36px !important; padding: 0 !important; margin: 0 !important; border-radius: 6px; background: #0ea5e9; border: 2px solid transparent; cursor: pointer; box-sizing: border-box;"></button>
                        </div>
                        <div style="display: flex; align-items: center; gap: 8px; margin-left: auto;">
                            <span style="font-size: 0.8rem; color: #a1a1aa; font-weight: 600;">Custom:</span>
                            <input type="color" id="new_project_color" name="color" value="#3b82f6" onchange="syncAddProjectCustomColor(this.value)" style="width: 36px; height: 36px; min-width: 36px; padding: 0; background: transparent; border: 1px solid #27272a; border-radius: 6px; cursor: pointer; box-sizing: border-box;">
                        </div>
                    </div>
                </div>

                <!-- Board Workflow Template Selection -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label style="display: block; font-size: 0.88rem; font-weight: 600; color: #ffffff; margin-bottom: 10px;">
                        <i class="fas fa-columns" style="color: #60a5fa; margin-right: 4px;"></i> Kanban Workflow Template
                    </label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                        <!-- Smart Work Template Option -->
                        <label id="add-tpl-smart-label" class="board-template-card" onclick="selectAddTemplate('smart')" style="display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border: 1.5px solid #3b82f6; border-radius: 12px; background: rgba(59, 130, 246, 0.08); cursor: pointer; transition: all 0.15s ease;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 1.15rem;">⚡</span>
                                    <span style="font-size: 0.95rem; font-weight: 700; color: #60a5fa;">Smart Work</span>
                                </div>
                                <input type="radio" id="add_tpl_smart" name="board_template" value="smart" checked style="accent-color: #3b82f6; width: 18px; height: 18px;">
                            </div>
                            <span style="font-size: 0.8rem; color: #a1a1aa; line-height: 1.35;">4 Focused Lists for agile, iterative delivery</span>
                            <div style="display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px;">
                                <span style="font-size: 0.72rem; background: #16181d; border: 1px solid #27272a; padding: 2px 7px; border-radius: 4px; color: #e4e4e7;">To Do</span>
                                <span style="font-size: 0.72rem; background: #16181d; border: 1px solid #27272a; padding: 2px 7px; border-radius: 4px; color: #e4e4e7;">In Progress</span>
                                <span style="font-size: 0.72rem; background: #16181d; border: 1px solid #27272a; padding: 2px 7px; border-radius: 4px; color: #e4e4e7;">On Hold</span>
                                <span style="font-size: 0.72rem; background: #16181d; border: 1px solid #27272a; padding: 2px 7px; border-radius: 4px; color: #e4e4e7;">Done</span>
                            </div>
                        </label>

                        <!-- Super Work Template Option -->
                        <label id="add-tpl-super-label" class="board-template-card" onclick="selectAddTemplate('super')" style="display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border: 1.5px solid #27272a; border-radius: 12px; background: #121316; cursor: pointer; transition: all 0.15s ease;">
                            <div style="display: flex; align-items: center; justify-content: space-between;">
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <span style="font-size: 1.15rem;">🚀</span>
                                    <span style="font-size: 0.95rem; font-weight: 700; color: #e4e4e7;">Super Work</span>
                                </div>
                                <input type="radio" id="add_tpl_super" name="board_template" value="super" style="accent-color: #3b82f6; width: 18px; height: 18px;">
                            </div>
                            <span style="font-size: 0.8rem; color: #a1a1aa; line-height: 1.35;">6 Full-Lifecycle Columns with Backlog & Canceled</span>
                            <div style="display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px;">
                                <span style="font-size: 0.72rem; background: #16181d; border: 1px solid #27272a; padding: 2px 7px; border-radius: 4px; color: #e4e4e7;">Backlog</span>
                                <span style="font-size: 0.72rem; background: #16181d; border: 1px solid #27272a; padding: 2px 7px; border-radius: 4px; color: #e4e4e7;">To Do</span>
                                <span style="font-size: 0.72rem; background: #16181d; border: 1px solid #27272a; padding: 2px 7px; border-radius: 4px; color: #e4e4e7;">Done</span>
                                <span style="font-size: 0.72rem; background: #16181d; border: 1px solid #27272a; padding: 2px 7px; border-radius: 4px; color: #e4e4e7;">Canceled</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Description / Purpose (Optional) -->
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="new_project_description" style="display: block; font-size: 0.85rem; font-weight: 600; color: #a1a1aa; margin-bottom: 8px;">
                        Description / Key Goals (Optional)
                    </label>
                    <textarea id="new_project_description" 
                              name="description" 
                              rows="3" 
                              spellcheck="true"
                              placeholder="Brief goals or notes for this project..."
                              style="background: #121316; border: 1px solid #27272a; color: #ffffff; font-size: 0.9rem; padding: 12px 14px; border-radius: 9px; width: 100%; box-sizing: border-box; outline: none; font-family: inherit; resize: vertical; min-height: 70px;"
                              onfocus="this.style.borderColor='#3b82f6';"
                              onblur="this.style.borderColor='#27272a';"></textarea>
                </div>
            </div>

            <!-- Modal Action Buttons -->
            <div class="modal-actions" style="display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 18px 28px; border-top: 1px solid #1f2328; background: #0e0f12; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
                <button type="button" class="btn-cancel" onclick="closeAddProjectModal()" style="height: 40px; padding: 0 18px; font-size: 0.88rem; font-weight: 600; color: #dee4ea; background: #18181b; border: 1px solid #27272a; border-radius: 8px; cursor: pointer; transition: all 0.15s ease;">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn-submit" style="height: 40px; padding: 0 24px; font-size: 0.92rem; font-weight: 700; color: #ffffff; background: #2563eb; border: none; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background 0.15s ease;">
                    <i class="fas fa-check"></i> Create Project
                </button>
            </div>
        </form>
    </div>
</div>

                        Description / Key Goals (Optional)
                    </label>
                    <textarea id="edit_project_description" 
                              name="description" 
                              rows="3" 
                              spellcheck="true"
                              placeholder="Brief goals or notes for this project..."
                              style="background: #121316; border: 1px solid #27272a; color: #ffffff; font-size: 0.9rem; padding: 12px 14px; border-radius: 9px; width: 100%; box-sizing: border-box; outline: none; font-family: inherit; resize: vertical; min-height: 70px;"
                              onfocus="this.style.borderColor='#3b82f6';"
                              onblur="this.style.borderColor='#27272a';"></textarea>
                </div>
            </div>

            <!-- Modal Action Buttons in Edit -->
            <div class="modal-actions" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 28px; border-top: 1px solid #1f2328; background: #0e0f12; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px;">
                <button type="button" id="edit-project-delete-btn" class="btn-danger" style="height: 40px; padding: 0 16px; font-size: 0.85rem; font-weight: 600; color: #f87171; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s ease;">
                    <i class="fas fa-trash-alt"></i> Delete Project
                </button>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <button type="button" class="btn-cancel" onclick="closeEditProjectModal()" style="height: 40px; padding: 0 18px; font-size: 0.88rem; font-weight: 600; color: #dee4ea; background: #18181b; border: 1px solid #27272a; border-radius: 8px; cursor: pointer; transition: all 0.15s ease;">
                        <i class="fas fa-times"></i> Cancel
                    </button>
                    <button type="submit" class="btn-submit" style="height: 40px; padding: 0 24px; font-size: 0.92rem; font-weight: 700; color: #ffffff; background: #2563eb; border: none; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; transition: background 0.15s ease;">
                        <i class="fas fa-check"></i> Save Changes
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>
