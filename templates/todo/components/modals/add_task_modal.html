<!-- Quick Add Task Modal -->
<div id="add-task-modal" class="task-modal" style="display: none;">
    <div class="modal-backdrop" onclick="closeAddTaskModal()"></div>
    <div class="modal-content" style="background: #000000; border: 1px solid #27272a; max-width: 480px; width: 100%; border-radius: 10px; box-shadow: 0 20px 40px rgba(0,0,0,0.9);">
        <div class="modal-header" style="border-bottom: 1px solid #27272a; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;">
            <h3 style="font-size: 1.05rem; font-weight: 700; color: #dee4ea; margin: 0; display: flex; align-items: center; gap: 8px;">
                <i class="fas fa-plus-circle" style="color: #3b82f6;"></i> Add New Task
            </h3>
            <button class="close-modal" aria-label="Close" onclick="closeAddTaskModal()" style="background: transparent; border: none; color: #8c9bab; font-size: 1.25rem; cursor: pointer;">&times;</button>
        </div>
        <form id="add-task-form" method="post" action="{% url 'task_create' %}" onsubmit="handleAddTaskFormSubmit(event)">
            {% csrf_token %}
            <div class="modal-body" style="padding: 18px; display: flex; flex-direction: column; gap: 14px;">
                <div class="form-group" style="margin-bottom: 0;">
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;">
                        <label for="add-task-title-input" style="font-size: 0.85rem; font-weight: 600; color: #dee4ea; margin: 0;">
                            Task Title *
                        </label>
                        <button type="button" 
                                onclick="autoCorrectInput('add-task-title-input')" 
                                style="background: rgba(59, 130, 246, 0.12); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; border-radius: 4px; padding: 2px 8px; font-size: 0.725rem; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.15s ease;"
                                title="Auto-correct spelling in English, Hindi & Hinglish">
                            <i class="fas fa-magic"></i> Auto-Correct
                        </button>
                    </div>
                    <input type="text" 
                           id="add-task-title-input" 
                           name="title" 
                           required 
                           spellcheck="true"
                           class="form-control" 
                           placeholder="e.g. Flex print karna hai Send to: Gopal Ji" 
                           style="background: #121316; border: 1px solid #27272a; color: #dee4ea; font-size: 0.9rem; padding: 10px 12px; border-radius: 6px; width: 100%; box-sizing: border-box; outline: none; font-family: inherit;"
                           onfocus="this.style.borderColor='#3b82f6';"
                           onblur="this.style.borderColor='#27272a';">
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="add-task-category-input" style="font-size: 0.825rem; font-weight: 600; color: #8c9bab; margin-bottom: 6px; display: block;">
                            Project
                        </label>
                        <select id="add-task-category-input" 
                                name="category" 
                                class="form-control" 
                                style="background: #121316; border: 1px solid #27272a; color: #dee4ea; font-size: 0.85rem; height: 38px; padding: 0 10px; border-radius: 6px; width: 100%; box-sizing: border-box; outline: none; cursor: pointer;">
                            <option value="">(No Project)</option>
                            {% if task_create_form %}
                                {% for p in task_create_form.fields.category.queryset %}
                                <option value="{{ p.id }}">{{ p.name }}</option>
                                {% endfor %}
                            {% else %}
                                {% for p in user.categories.all %}
                                <option value="{{ p.id }}">{{ p.name }}</option>
                                {% endfor %}
                            {% endif %}
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="add-task-status-input" style="font-size: 0.825rem; font-weight: 600; color: #8c9bab; margin-bottom: 6px; display: block;">
                            Status / Column
                        </label>
                        <select id="add-task-status-input" 
                                name="status" 
                                class="form-control" 
                                style="background: #121316; border: 1px solid #27272a; color: #dee4ea; font-size: 0.85rem; height: 38px; padding: 0 10px; border-radius: 6px; width: 100%; box-sizing: border-box; outline: none; cursor: pointer;">
                            <option value="not-started">To Do</option>
                            <option value="in-progress">In Progress</option>
                            <option value="on-hold">On Hold</option>
                            <option value="completed">Done</option>
                            <option value="backlog">Backlog</option>
                            <option value="canceled">Canceled</option>
                        </select>
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="add-task-priority-input" style="font-size: 0.825rem; font-weight: 600; color: #8c9bab; margin-bottom: 6px; display: block;">
                            Priority
                        </label>
                        <select id="add-task-priority-input" 
                                name="priority" 
                                class="form-control" 
                                style="background: #121316; border: 1px solid #27272a; color: #dee4ea; font-size: 0.85rem; height: 38px; padding: 0 10px; border-radius: 6px; width: 100%; box-sizing: border-box; outline: none; cursor: pointer;">
                            <option value="low">🟢 Low</option>
                            <option value="moderate" selected>🟡 Moderate</option>
                            <option value="high">🔴 High</option>
                        </select>
                    </div>

                    <div class="form-group" style="margin-bottom: 0;">
                        <label for="add-task-due-date-input" style="font-size: 0.825rem; font-weight: 600; color: #8c9bab; margin-bottom: 6px; display: block;">
                            Due Date (Optional)
                        </label>
                        <input type="date" 
                               id="add-task-due-date-input" 
                               name="due_date" 
                               class="form-control" 
                               style="background: #121316; border: 1px solid #27272a; color: #dee4ea; font-size: 0.85rem; height: 38px; padding: 0 10px; border-radius: 6px; width: 100%; box-sizing: border-box; outline: none;">
                    </div>
                </div>
            </div>
            <div class="modal-actions form-actions" style="border-top: 1px solid #27272a; padding: 14px 18px; margin: 0; display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn-cancel" onclick="closeAddTaskModal()" style="height: 38px; background: #16181d; border: 1px solid #282e33; color: #b6c2cf; border-radius: 6px; padding: 0 14px; font-size: 0.825rem; font-weight: 600; cursor: pointer;">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn-submit" id="add-task-submit-btn" style="height: 38px; background: linear-gradient(135deg, #2563eb, #3b82f6); border: none; color: #ffffff; border-radius: 6px; padding: 0 18px; font-size: 0.825rem; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
                    <i class="fas fa-plus"></i> Create Task
                </button>
            </div>
        </form>
    </div>
</div>
