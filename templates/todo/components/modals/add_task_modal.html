<!-- Add Task Modal (Alpine.js & Global Trigger) -->
<div id="add-task-modal" 
     class="task-modal" 
     style="display: none;"
     x-data="{ isOpen: false }"
     @open-add-task-modal.window="isOpen = true; document.getElementById('add-task-modal').style.display='flex';"
     @close-add-task-modal.window="isOpen = false; document.getElementById('add-task-modal').style.display='none';">
    <div class="modal-backdrop" onclick="document.getElementById('add-task-modal').style.display='none';"></div>
    <div class="modal-content" style="background: #000000; border: 1px solid #27272a;">
        <div class="modal-header">
            <h3><i class="fas fa-plus-circle" style="color: var(--accent-color);"></i> Add New Task</h3>
            <button class="close-modal" aria-label="Close" onclick="document.getElementById('add-task-modal').style.display='none';">&times;</button>
        </div>
        <form id="add-task-form" class="task-form" method="post" action="{% url 'task_create' %}">
            {% csrf_token %}
            <div class="modal-body">
                <div class="form-group form-grid-full">
                    <label for="{{ task_create_form.title.id_for_label }}">
                        <i class="fas fa-heading"></i> Task Title *
                    </label>
                    {{ task_create_form.title }}
                </div>

                <div class="form-group form-grid-full">
                    <label for="{{ task_create_form.description.id_for_label }}">
                        <i class="fas fa-align-left"></i> Description
                    </label>
                    {{ task_create_form.description }}
                </div>

                <div class="form-group">
                    <label for="{{ task_create_form.category.id_for_label }}">
                        <i class="fas fa-folder"></i> Project / Category
                    </label>
                    {{ task_create_form.category }}
                </div>

                <div class="form-group">
                    <label for="{{ task_create_form.priority.id_for_label }}">
                        <i class="fas fa-flag"></i> Priority
                    </label>
                    {{ task_create_form.priority }}
                </div>

                <div class="form-group">
                    <label for="{{ task_create_form.status.id_for_label }}">
                        <i class="fas fa-tasks"></i> Status
                    </label>
                    {{ task_create_form.status }}
                </div>

                <div class="form-group">
                    <label for="{{ task_create_form.due_date.id_for_label }}">
                        <i class="fas fa-calendar-alt"></i> Due Date
                    </label>
                    {{ task_create_form.due_date }}
                </div>
            </div>
            <div class="modal-actions form-actions">
                <button type="button" class="btn-cancel" onclick="document.getElementById('add-task-modal').style.display='none';">
                    <i class="fas fa-times"></i> Cancel
                </button>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-plus"></i> Create Task
                </button>
            </div>
        </form>
    </div>
</div>
