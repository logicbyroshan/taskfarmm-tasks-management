{% load static %}
<!-- Sub-User Management Modal (Create / Edit) -->
<div id="manage-subuser-modal" class="modal" style="display: none; align-items: center; justify-content: center; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(10px); z-index: 1050; padding: 20px;">
    <div class="modal-content" style="background: #09090b; border: 1px solid #27272a; border-radius: 14px; width: 100%; max-width: 520px; box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9); overflow: hidden;">
        <!-- Modal Header -->
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #1f2328; background: #121316;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <div style="width: 34px; height: 34px; border-radius: 8px; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); display: flex; align-items: center; justify-content: center; color: #3b82f6;">
                    <i class="fas fa-user-plus" id="subuser-modal-icon"></i>
                </div>
                <div>
                    <h3 id="subuser-modal-title" style="margin: 0; font-size: 1.05rem; font-weight: 700; color: #ffffff;">Add New Sub-User</h3>
                    <span style="font-size: 0.75rem; color: #a1a1aa;">Team account under your organization (Max 99)</span>
                </div>
            </div>
            <button type="button" onclick="closeSubUserModal()" class="close-btn" style="background: transparent; border: none; color: #71717a; font-size: 1.4rem; cursor: pointer; padding: 0 4px; line-height: 1;" aria-label="Close modal">&times;</button>
        </div>

        <!-- Modal Form -->
        <form id="manage-subuser-form" onsubmit="handleSubUserFormSubmit(event)" style="padding: 22px 24px; display: flex; flex-direction: column; gap: 16px;">
            {% csrf_token %}
            <input type="hidden" id="subuser-id" name="subuser_id" value="">

            <!-- Username Field -->
            <div class="form-group" style="margin: 0;">
                <label for="subuser-username" style="display: block; font-size: 0.82rem; font-weight: 600; color: #e4e4e7; margin-bottom: 6px;">
                    Username <span style="color: #ef4444;">*</span>
                </label>
                <div style="position: relative;">
                    <i class="fas fa-at" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #71717a; font-size: 0.85rem;"></i>
                    <input type="text" id="subuser-username" name="username" required minlength="3" maxlength="150"
                           class="form-control" placeholder="e.g. dev_alex or designer_roshan"
                           style="width: 100%; padding: 10px 12px 10px 34px; background: #000000; border: 1px solid #27272a; border-radius: 8px; color: #ffffff; font-size: 0.9rem; outline: none; box-sizing: border-box;">
                </div>
                <span style="font-size: 0.72rem; color: #71717a; margin-top: 4px; display: block;">Used by sub-user to sign in. No unique email required.</span>
            </div>

            <!-- Display Name & Role (2 Column) -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group" style="margin: 0;">
                    <label for="subuser-display-name" style="display: block; font-size: 0.82rem; font-weight: 600; color: #e4e4e7; margin-bottom: 6px;">
                        Full Name
                    </label>
                    <input type="text" id="subuser-display-name" name="display_name" maxlength="100"
                           class="form-control" placeholder="e.g. Alex Mercer"
                           style="width: 100%; padding: 10px 12px; background: #000000; border: 1px solid #27272a; border-radius: 8px; color: #ffffff; font-size: 0.9rem; outline: none; box-sizing: border-box;">
                </div>

                <div class="form-group" style="margin: 0;">
                    <label for="subuser-role" style="display: block; font-size: 0.82rem; font-weight: 600; color: #e4e4e7; margin-bottom: 6px;">
                        Role
                    </label>
                    <select id="subuser-role" name="role" class="form-control"
                            style="width: 100%; padding: 10px 12px; background: #000000; border: 1px solid #27272a; border-radius: 8px; color: #ffffff; font-size: 0.9rem; outline: none; box-sizing: border-box;">
                        <option value="member" selected>Member (Standard)</option>
                        <option value="admin">Admin (Full Workspace)</option>
                        <option value="viewer">Viewer (Read Only)</option>
                    </select>
                </div>
            </div>

            <!-- Password Field -->
            <div class="form-group" style="margin: 0;">
                <label for="subuser-password" style="display: flex; justify-content: space-between; font-size: 0.82rem; font-weight: 600; color: #e4e4e7; margin-bottom: 6px;">
                    <span>Password <span id="subuser-pwd-required" style="color: #ef4444;">*</span></span>
                    <span id="subuser-pwd-hint" style="font-size: 0.72rem; color: #a1a1aa; display: none;">(Leave blank to keep current)</span>
                </label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #71717a; font-size: 0.85rem;"></i>
                    <input type="password" id="subuser-password" name="password" minlength="4"
                           class="form-control" placeholder="Enter secure password"
                           style="width: 100%; padding: 10px 38px 10px 34px; background: #000000; border: 1px solid #27272a; border-radius: 8px; color: #ffffff; font-size: 0.9rem; outline: none; box-sizing: border-box;">
                    <button type="button" onclick="toggleSubUserPwdVisibility()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #71717a; cursor: pointer; padding: 4px;">
                        <i class="fas fa-eye" id="subuser-pwd-eye"></i>
                    </button>
                </div>
            </div>

            <!-- Assigned Projects Checklist -->
            <div class="form-group" style="margin: 0;">
                <label style="display: block; font-size: 0.82rem; font-weight: 600; color: #e4e4e7; margin-bottom: 6px;">
                    Assign Projects (Workspace Access)
                </label>
                <div id="subuser-projects-list" style="max-height: 120px; overflow-y: auto; background: #000000; border: 1px solid #27272a; border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px;">
                    {% for p in categories %}
                    <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: #d4d4d8; cursor: pointer; margin: 0; padding: 4px 0;">
                        <input type="checkbox" name="assigned_projects" value="{{ p.id }}" class="subuser-project-cb" style="accent-color: #3b82f6; width: 15px; height: 15px;">
                        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{ p.color }}; flex-shrink: 0;"></span>
                        <span>{{ p.name }}</span>
                    </label>
                    {% empty %}
                    <span style="font-size: 0.8rem; color: #71717a; padding: 4px 0;">No projects created yet.</span>
                    {% endfor %}
                </div>
            </div>

            <!-- Actions -->
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; padding-top: 14px; border-top: 1px solid #1f2328;">
                <button type="button" onclick="closeSubUserModal()" class="btn-secondary" style="padding: 9px 18px; border-radius: 8px; background: #18181b; border: 1px solid #27272a; color: #d4d4d8; font-size: 0.85rem; cursor: pointer;">
                    Cancel
                </button>
                <button type="submit" id="subuser-submit-btn" class="btn-primary" style="padding: 9px 20px; border-radius: 8px; background: #2563eb; border: 1px solid #3b82f6; color: #ffffff; font-weight: 600; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                    <i class="fas fa-check"></i> <span id="subuser-btn-text">Save Sub-User</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script>
window.openSubUserModal = function() {
    const modal = document.getElementById('manage-subuser-modal');
    if (!modal) return;
    const form = document.getElementById('manage-subuser-form');
    if (form) form.reset();
    
    document.getElementById('subuser-id').value = '';
    document.getElementById('subuser-modal-title').textContent = 'Add New Sub-User';
    document.getElementById('subuser-modal-icon').className = 'fas fa-user-plus';
    document.getElementById('subuser-btn-text').textContent = 'Create Sub-User';
    document.getElementById('subuser-username').readOnly = false;
    document.getElementById('subuser-password').required = true;
    document.getElementById('subuser-pwd-required').style.display = 'inline';
    document.getElementById('subuser-pwd-hint').style.display = 'none';

    document.querySelectorAll('.subuser-project-cb').forEach(cb => cb.checked = false);
    modal.style.display = 'flex';
};

window.openEditSubUserModal = function(subuser) {
    const modal = document.getElementById('manage-subuser-modal');
    if (!modal) return;

    if (typeof subuser === 'string') {
        try { subuser = JSON.parse(subuser); } catch(e){}
    }

    document.getElementById('subuser-id').value = subuser.id;
    document.getElementById('subuser-modal-title').textContent = `Edit Sub-User (@${subuser.username})`;
    document.getElementById('subuser-modal-icon').className = 'fas fa-user-edit';
    document.getElementById('subuser-btn-text').textContent = 'Save Changes';
    
    document.getElementById('subuser-username').value = subuser.username || '';
    document.getElementById('subuser-display-name').value = subuser.first_name || subuser.name || '';
    document.getElementById('subuser-role').value = subuser.role || 'member';
    
    const pwdInput = document.getElementById('subuser-password');
    pwdInput.value = '';
    pwdInput.required = false;
    document.getElementById('subuser-pwd-required').style.display = 'none';
    document.getElementById('subuser-pwd-hint').style.display = 'inline';

    const assignedIds = subuser.assigned_project_ids || [];
    document.querySelectorAll('.subuser-project-cb').forEach(cb => {
        cb.checked = assignedIds.includes(parseInt(cb.value)) || assignedIds.includes(cb.value);
    });

    modal.style.display = 'flex';
};

window.closeSubUserModal = function() {
    const modal = document.getElementById('manage-subuser-modal');
    if (modal) modal.style.display = 'none';
};

window.toggleSubUserPwdVisibility = function() {
    const pwdInput = document.getElementById('subuser-password');
    const eyeIcon = document.getElementById('subuser-pwd-eye');
    if (!pwdInput || !eyeIcon) return;
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.className = 'fas fa-eye-slash';
    } else {
        pwdInput.type = 'password';
        eyeIcon.className = 'fas fa-eye';
    }
};

window.handleSubUserFormSubmit = function(e) {
    e.preventDefault();
    const subuserId = document.getElementById('subuser-id').value;
    const isEdit = Boolean(subuserId);
    const username = document.getElementById('subuser-username').value.trim();
    const displayName = document.getElementById('subuser-display-name').value.trim();
    const password = document.getElementById('subuser-password').value;
    const role = document.getElementById('subuser-role').value;

    const assignedProjects = [];
    document.querySelectorAll('.subuser-project-cb:checked').forEach(cb => {
        assignedProjects.push(parseInt(cb.value));
    });

    const submitBtn = document.getElementById('subuser-submit-btn');
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.6';
    }

    const csrfToken = (window.getCsrfToken ? window.getCsrfToken() : null) || document.querySelector('[name=csrfmiddlewaretoken]')?.value;
    const url = isEdit ? `/api/subusers/${subuserId}/update/` : '/api/subusers/create/';

    const payload = {
        username: username,
        display_name: displayName,
        role: role,
        assigned_projects: assignedProjects
    };
    if (password) payload.password = password;

    fetch(url, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken,
            'X-Requested-With': 'XMLHttpRequest'
        },
        body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(data => {
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
        }
        if (data.success) {
            if (window.showToast) window.showToast(data.message || 'Saved successfully!', 'success');
            window.closeSubUserModal();
            setTimeout(() => window.location.reload(), 500);
        } else {
            if (window.showToast) window.showToast(data.error || 'Failed to save sub-user', 'error');
            else alert(data.error || 'Failed to save sub-user');
        }
    })
    .catch(err => {
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.style.opacity = '1';
        }
        console.error('Sub-user save error:', err);
        if (window.showToast) window.showToast('Network error while saving sub-user', 'error');
    });
};

window.deleteSubUser = function(subuserId, username) {
    if (!confirm(`Are you sure you want to delete sub-user "@${username}"? They will lose access to all assigned projects and tasks.`)) {
        return;
    }

    const csrfToken = (window.getCsrfToken ? window.getCsrfToken() : null) || document.querySelector('[name=csrfmiddlewaretoken]')?.value;
    fetch(`/api/subusers/${subuserId}/delete/`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken,
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
    .then(r => r.json())
    .then(data => {
        if (data.success) {
            if (window.showToast) window.showToast('Sub-user deleted successfully.', 'success');
            const card = document.getElementById(`subuser-card-${subuserId}`);
            if (card) {
                card.style.opacity = '0';
                card.style.transform = 'scale(0.9)';
                setTimeout(() => card.remove(), 250);
            } else {
                setTimeout(() => window.location.reload(), 400);
            }
        } else {
            if (window.showToast) window.showToast(data.error || 'Failed to delete sub-user', 'error');
            else alert(data.error || 'Failed to delete sub-user');
        }
    })
    .catch(err => {
        console.error('Delete subuser error:', err);
        if (window.showToast) window.showToast('Error deleting sub-user', 'error');
    });
};
</script>
