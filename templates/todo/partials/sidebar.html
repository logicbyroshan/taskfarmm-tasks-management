<aside class="sidebar" role="navigation" aria-label="Main navigation">
    {% if user.is_authenticated %}
    
    <nav class="sidebar-nav">
        <ul role="list">
            <li class="{% if active_page == 'dashboard' %}active{% endif %}">
                <a href="{% url 'dashboard' %}">
                    <i class="fas fa-th-large" aria-hidden="true"></i> Dashboard
                </a>
            </li>
            <li class="{% if active_page == 'task_categories' %}active{% endif %}">
                <a href="{% url 'task_categories' %}">
                    <i class="fas fa-folder-open" aria-hidden="true"></i> Projects
                </a>
            </li>
            <li class="{% if active_page == 'manage_kanban' %}active{% endif %}">
                <a href="{% url 'manage_kanban' %}">
                    <i class="fas fa-columns" aria-hidden="true"></i> Kanban Board
                </a>
            </li>
            <li class="{% if active_page == 'manage_tasks' or active_page == 'my_tasks' %}active{% endif %}">
                <a href="{% url 'manage_tasks' %}">
                    <i class="fas fa-list-ul" aria-hidden="true"></i> All Tasks
                </a>
            </li>
            <li class="{% if active_page == 'ai_assistant' %}active{% endif %}">
                <a href="{% url 'ai_assistant' %}">
                    <i class="fas fa-robot" aria-hidden="true"></i> AI Assistant
                </a>
            </li>

        </ul>
    </nav>
    
    <div class="sidebar-bottom">
        <div class="sidebar-settings-link {% if active_page == 'settings' %}active{% endif %}">
            <a href="{% url 'settings' %}">
                <i class="fas fa-cog" aria-hidden="true"></i> Settings
            </a>
        </div>

        <div class="sidebar-divider"></div>
        
        <!-- Logout button -->
        <div class="logout-btn">
            <a href="{% url 'logout' %}" class="btn-logout" aria-label="Logout">
                <i class="fas fa-sign-out-alt" aria-hidden="true"></i> Logout
            </a>
        </div>
    </div>
    {% else %}
    <div class="login-prompt">
        <p>Please log in to continue.</p>
    </div>
    {% endif %}
</aside>
