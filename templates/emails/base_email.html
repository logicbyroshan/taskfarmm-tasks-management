<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"TaskFlixx Notification" }}</title>
    <style>
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0; padding: 0; width: 100% !important; background-color: #060709; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #e2e8f0; }
        @media screen and (max-width: 600px) {
            .email-container { width: 100% !important; max-width: 100% !important; }
            .card-body { padding: 24px 20px !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #060709; color: #e2e8f0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color: #060709; width: 100%; margin: 0; padding: 30px 10px;">
        <tr>
            <td align="center">
                <!-- Main Email Card (Max width 560px) -->
                <table role="presentation" class="email-container" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width: 560px; width: 100%; background: #0f1217; border: 1px solid #27272a; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.8);">
                    
                    <!-- Header with Logo -->
                    <tr>
                        <td align="center" style="padding: 28px 24px 20px 24px; border-bottom: 1px solid #1f242d; background: linear-gradient(180deg, #141820 0%, #0f1217 100%);">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center" style="font-size: 1.45rem; font-weight: 800; letter-spacing: -0.02em; color: #ffffff;">
                                        ⚡ Task<span style="color: #60a5fa;">Flixx</span>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="font-size: 0.75rem; color: #8c9bab; padding-top: 4px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600;">
                                        Next-Gen Smart Project Orchestration
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Body Content -->
                    <tr>
                        <td class="card-body" style="padding: 32px 30px 28px 30px;">
                            {% block content %}
                            <!-- Dynamic email body injected here -->
                            {% endblock %}
                        </td>
                    </tr>

                    <!-- Action Button Block (if action_url provided) -->
                    {% if action_url %}
                    <tr>
                        <td align="center" style="padding: 0 30px 32px 30px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center" style="border-radius: 8px; background: #2563eb;">
                                        <a href="{{ action_url }}" target="_blank" style="font-size: 0.9rem; font-weight: 700; color: #ffffff; text-decoration: none; padding: 12px 28px; border-radius: 8px; display: inline-block; background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); border: 1px solid #3b82f6; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);">
                                            {{ action_text|default:"Open in TaskFlixx" }} &rarr;
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    {% endif %}

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 30px; background: #0b0d10; border-top: 1px solid #1c2027; text-align: center; font-size: 0.75rem; color: #71717a; line-height: 1.5;">
                            <p style="margin: 0 0 6px 0;">
                                Sent automatically by <strong>TaskFlixx</strong> to {{ recipient_email|default:"you" }}.
                            </p>
                            <p style="margin: 0;">
                                Manage your preferences in <a href="{{ preferences_url|default:'http://127.0.0.1:8000/settings/' }}" style="color: #60a5fa; text-decoration: underline;">Settings</a>.
                            </p>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
