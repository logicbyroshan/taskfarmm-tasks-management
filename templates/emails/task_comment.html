{% extends "emails/base_email.html" %}

{% block content %}
<h2 style="font-size: 1.25rem; font-weight: 700; color: #ffffff; margin: 0 0 12px 0;">
    💬 New Comment on "{{ task_title }}"
</h2>
<p style="font-size: 0.9rem; color: #94a3b8; line-height: 1.5; margin: 0 0 18px 0;">
    <strong>{{ author_name|default:"A teammate" }}</strong> left a comment on your task:
</p>

<!-- Comment Quote Box -->
<div style="background: #141820; border-left: 3px solid #3b82f6; border-top: 1px solid #27272a; border-right: 1px solid #27272a; border-bottom: 1px solid #27272a; border-radius: 8px; padding: 16px 18px; margin-bottom: 24px;">
    <div style="font-size: 0.775rem; font-weight: 700; color: #60a5fa; margin-bottom: 6px;">
        {{ author_name }} &bull; <span style="color: #71717a; font-weight: 400;">Just now</span>
    </div>
    <div style="font-size: 0.875rem; color: #e2e8f0; line-height: 1.55; white-space: pre-wrap;">
        {{ comment_text }}
    </div>
</div>

<p style="font-size: 0.8rem; color: #8c9bab; margin: 0 0 10px 0;">
    Project: <strong style="color: #cbd5e1;">{{ project_name|default:"General Tasks" }}</strong>
</p>
{% endblock %}
